[project]
name = "eurotech-hack-backend"
version = "0.1.0"
description = "Backend artifact pipeline scaffolding for the SiC anomaly workbench."
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0",
  "ruff>=0.12.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "ANN",
  "ARG",
  "SIM",
]
ignore = [
  "ANN401",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN201"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
